name: RPi - Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install test dependencies
        run: pip install pytest

      # NOTE: `rgbmatrix` (hzeller's rpi-rgb-led-matrix Python binding) is intentionally NOT
      # installed here - it's a compiled C++ extension that only builds against real Raspberry Pi
      # GPIO/DMA hardware and isn't in requirements.txt for that reason (see
      # docs/GETTING_STARTED.md). The test suite is structured to never import core.matrix
      # directly (tests/conftest.py mocks the whole matrix layer), so this is safe and expected.
      - name: Run pytest
        run: python -m pytest tests/ -v
